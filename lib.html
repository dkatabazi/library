<!DOCTYPE html>
<html>
    <head>
        <title>library</title>
        <style>
            .libform {
                background-color: blanchedalmond;
                padding: 20px;
                width: 500px;
                height: auto;
                background-color: rgb(208, 164, 18);
                color:rgb(100, 52, 7);
                font-family: 'Courier New', Courier, monospace;
                border-radius: 20px;
                box-shadow: 10px 20px color lightblue;
            }
            body {
                background-color: aliceblue;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            button {
                background-color:aqua;
                color:rgb(222, 150, 150)
            }
        </style>
    </head>
    <body>
        <div class ="libform">
            <h1>DIVINE BOOKSHOP</h1>
            <br>
            <label>book name</label>
            <input id="bookName" type="text" placeholder="what book title">
            <p>home of books</p>
            <p id="message">message</p>
            <button id="selectbtn" type="button">submit</button>
            <br>
            <label>search book</label>
            <input id="searchBook" type="text" placeholder="search book title">
            <p>home of books</p>
            <p id="message2" >loading...</p>
            <button id="searchbtn" type="button">search</button>
        </div>
        <script>
            const searchbtn = document.getElementById("searchbtn");
            const searchBook = document.getElementById("searchBook");

            const message2=document.getElementById("message2")
            const selectbtn = document.getElementById("selectbtn");
            const message=document.getElementById("message")
            const bookName = document.getElementById("bookName");
            selectbtn.addEventListener("click", function() {
                fetch("http://localhost:3000/api/books", {
                      method: "POST",
                      headers: {
                          "Content-Type": "application/json"
                      },
                      body: JSON.stringify({
                          title: bookName.value
                      })
                })
                .then(res => res.json())
                .then(data => {
                    message.textContent = data.message;
                    bookName.value = ""
                    setTimeout(() => {
                        message.textContent = "";
                    }, 2000);
                })
                .catch(error => {
                    message.textContent = "Error: " + error.message;
                    console.error("Fetch failed:", error);
                });
            });
            searchbtn.addEventListener("click", function() {

                fetch("http://localhost:3000/api/books?title=" + searchBook.value)
                    .then(res => res.json())
                    .then(data => {
                        message2.textContent = JSON.stringify(data.books);
                        searchBook.value=""
                        setTimeout(() => {
                            message2.textContent = "";
                        }, 2000);
                    })
                    .catch(error => {
                        console.error("Search failed:", error);
                    });

            });
        </script>
    </body>
</html>
